<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work360 - Candidate Ranking System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Main Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Cards */
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Job Cards */
        .job-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .job-card {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .job-card:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }

        .job-card.selected {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .job-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .job-description {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .job-meta {
            display: flex;
            gap: 15px;
            font-size: 0.8rem;
            color: #999;
        }

        /* Textarea */
        .jd-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
            margin-bottom: 15px;
        }

        .jd-input:focus {
            outline: none;
            border-color: #667eea;
        }

        /* Button */
        .find-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .find-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102,126,234,0.4);
        }

        .find-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Loading Spinner */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Results */
        .results {
            margin-top: 30px;
        }

        .stats {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        .requirements-badge {
            background: #e8f4f8;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .candidate-card {
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
            background: white;
        }

        .candidate-card:hover {
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .candidate-name {
            font-size: 18px;
            font-weight: 700;
            color: #333;
        }

        .match-score {
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
        }

        .score-high { background: #d4edda; color: #155724; }
        .score-medium { background: #fff3cd; color: #856404; }
        .score-low { background: #f8d7da; color: #721c24; }

        .candidate-details {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #666;
            flex-wrap: wrap;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .skill {
            background: #f0f0f0;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            color: #555;
        }

        .skill.highlight {
            background: #667eea;
            color: white;
        }

        .rationale {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 10px;
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 10px;
        }

        .badge-yes { background: #d4edda; color: #155724; }
        .badge-no { background: #f8d7da; color: #721c24; }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Work360 Candidate Ranking</h1>
            <p>AI-powered candidate matching system</p>
        </div>

        <div class="main-grid">
            <!-- Left Panel - Job Input -->
            <div class="card">
                <h2>📋 Job Description</h2>
                
                <!-- Sample Job Templates -->
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px;">Quick Templates:</label>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <button onclick="loadTemplate('python')" style="padding: 6px 12px; background: #f0f0f0; border: none; border-radius: 6px; cursor: pointer;">🐍 Python Dev</button>
                        <button onclick="loadTemplate('frontend')" style="padding: 6px 12px; background: #f0f0f0; border: none; border-radius: 6px; cursor: pointer;">⚛️ React Dev</button>
                        <button onclick="loadTemplate('devops')" style="padding: 6px 12px; background: #f0f0f0; border: none; border-radius: 6px; cursor: pointer;">☁️ DevOps</button>
                        <button onclick="loadTemplate('ml')" style="padding: 6px 12px; background: #f0f0f0; border: none; border-radius: 6px; cursor: pointer;">🤖 ML Engineer</button>
                    </div>
                </div>

                <textarea id="jobDescription" class="jd-input" rows="8" placeholder="Paste job description here...">Senior Python Developer needed with 5+ years experience.
Required skills: FastAPI, React, PostgreSQL, Docker.
Location: Remote
Nice to have: AWS, Kubernetes</textarea>
                
                <button id="findBtn" class="find-btn" onclick="findMatches()">
                    🔍 Find Matches
                </button>
            </div>

            <!-- Right Panel - Results -->
            <div class="card">
                <h2>🏆 Candidate Rankings</h2>
                <div id="results">
                    <div style="text-align: center; padding: 40px; color: #999;">
                        Click "Find Matches" to see ranked candidates
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sample job templates
        const templates = {
            python: `Senior Python Developer - Remote
We are looking for a Senior Python Developer with 5+ years of experience.
Required Skills:
- Python
- FastAPI or Django
- PostgreSQL
- React
- Docker
- AWS

Responsibilities:
- Design and develop REST APIs
- Lead technical decisions
- Mentor junior developers

Location: Remote
Salary: $140k - $180k`,

            frontend: `Senior React Developer - New York
Looking for an experienced React Developer with 4+ years of experience.
Required Skills:
- React.js
- TypeScript
- Redux
- Node.js
- MongoDB
- Tailwind CSS

Requirements:
- Experience with modern React patterns
- Strong JavaScript/ES6 knowledge
- Understanding of web performance

Location: New York (Hybrid)
Benefits: Competitive salary + equity`,

            devops: `DevOps Engineer - Austin
Seeking a DevOps Engineer with 3+ years of experience.
Required Skills:
- Kubernetes
- Docker
- AWS/Azure
- Terraform
- CI/CD pipelines
- Linux

Nice to have:
- Go or Python
- Prometheus/Grafana

Location: Austin, TX
Remote: Yes`,

            ml: `Machine Learning Engineer - Seattle
Join our AI team as an ML Engineer with 3+ years of experience.
Required Skills:
- Python
- TensorFlow/PyTorch
- Pandas/NumPy
- SQL
- Scikit-learn
- AWS SageMaker

Requirements:
- MS/PhD in CS/ML preferred
- Experience with production ML systems

Location: Seattle (Remote available)`
        };

        function loadTemplate(type) {
            document.getElementById('jobDescription').value = templates[type];
        }

        async function findMatches() {
            const btn = document.getElementById('findBtn');
            const resultsDiv = document.getElementById('results');
            const jobDescription = document.getElementById('jobDescription').value;
            
            if (!jobDescription.trim()) {
                resultsDiv.innerHTML = '<div class="error">❌ Please enter a job description</div>';
                return;
            }
            
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Analyzing Candidates...';
            resultsDiv.innerHTML = '<div style="text-align: center; padding: 40px;"><span class="spinner"></span> Loading matches...</div>';
            
            try {
                const response = await fetch('http://localhost:8000/Api/mike/match', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        job_description: jobDescription
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                displayResults(data);
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="error">
                        <strong>❌ Error:</strong> ${error.message}<br>
                        Make sure the backend server is running at http://localhost:8000
                    </div>
                `;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🔍 Find Matches';
            }
        }
        
        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            
            if (!data.top_candidates || data.top_candidates.length === 0) {
                resultsDiv.innerHTML = '<div class="no-results">No candidates found matching your criteria</div>';
                return;
            }
            
            let html = `
                <div class="stats">
                    <span>📊 ${data.total_candidates_considered} candidates analyzed</span>
                    <span>⚡ ${data.query_time_ms} ms</span>
                </div>
                <div class="requirements-badge">
                    <strong>📋 Job Requirements</strong><br>
                    <strong>Role:</strong> ${data.job_requirements.role}<br>
                    <strong>Experience:</strong> ${data.job_requirements.experience_band} (${data.job_requirements.years_experience_min}+ years)<br>
                    <strong>Location:</strong> ${data.job_requirements.location}<br>
                    <strong>Required Skills:</strong> ${data.job_requirements.skills.join(', ')}
                </div>
            `;
            
            data.top_candidates.forEach((match, index) => {
                const c = match.candidate;
                let scoreClass = 'score-low';
                if (match.match_score >= 70) scoreClass = 'score-high';
                else if (match.match_score >= 50) scoreClass = 'score-medium';
                
                // Highlight matching skills
                const requiredSkills = data.job_requirements.skills.map(s => s.toLowerCase());
                
                html += `
                    <div class="candidate-card">
                        <div class="card-header">
                            <div class="candidate-name">
                                #${index + 1} - ${c.name}
                                <span class="badge ${match.experience_match ? 'badge-yes' : 'badge-no'}">
                                    ${match.experience_match ? '✓ Exp' : '! Exp'}
                                </span>
                                <span class="badge ${match.location_match ? 'badge-yes' : 'badge-no'}">
                                    ${match.location_match ? '✓ Loc' : '! Loc'}
                                </span>
                            </div>
                            <div class="match-score ${scoreClass}">
                                ${match.match_score}% Match
                            </div>
                        </div>
                        
                        <div class="candidate-details">
                            <span>💼 ${c.current_role || 'N/A'}</span>
                            <span>⭐ ${c.experience_years} years</span>
                            <span>📍 ${c.location}</span>
                            <span>🎓 ${c.education || 'N/A'}</span>
                            <span>📧 ${c.email}</span>
                        </div>
                        
                        <div class="skills">
                            ${c.skills.map(skill => {
                                const isMatch = requiredSkills.includes(skill.toLowerCase());
                                return `<span class="skill ${isMatch ? 'highlight' : ''}">${skill}</span>`;
                            }).join('')}
                        </div>
                        
                        <div class="rationale">
                            <strong>🔍 Match Analysis:</strong> ${match.match_rationale}
                        </div>
                        
                        <details style="margin-top: 10px;">
                            <summary style="cursor: pointer; color: #667eea; font-size: 13px;">📊 View Detailed Metrics</summary>
                            <div style="margin-top: 10px; padding: 10px; background: #f8f9fa; border-radius: 8px; font-size: 13px;">
                                <div>📈 Skills Match: ${match.skill_match_percentage}%</div>
                                <div>✅ Experience Requirement: ${match.experience_match ? 'Meets requirements' : 'Below requirements'}</div>
                                <div>📍 Location Compatibility: ${match.location_match ? 'Compatible' : 'Not compatible'}</div>
                            </div>
                        </details>
                        
                        <div style="margin-top: 12px; display: flex; gap: 10px;">
                            <button onclick="contactCandidate('${c.email}')" style="padding: 6px 12px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px;">
                                📧 Contact
                            </button>
                            <button onclick="viewProfile('${c.id}')" style="padding: 6px 12px; background: #f0f0f0; border: none; border-radius: 6px; cursor: pointer; font-size: 12px;">
                                👤 View Profile
                            </button>
                        </div>
                    </div>
                `;
            });
            
            resultsDiv.innerHTML = html;
        }
        
        function contactCandidate(email) {
            alert(`Initiating contact with: ${email}\n\nIn a real implementation, this would open your email client or messaging system.`);
            // In production, you would implement:
            // window.location.href = `mailto:${email}`;
        }
        
        function viewProfile(candidateId) {
            alert(`Viewing profile for candidate ID: ${candidateId}\n\nIn a real implementation, this would show the full candidate profile.`);
            // In production, you would navigate to candidate profile
        }
        
        // Auto-run on page load
        window.addEventListener('load', () => {
            // Optionally auto-find matches
            // setTimeout(findMatches, 500);
        });
    </script>
</body>
</html>
