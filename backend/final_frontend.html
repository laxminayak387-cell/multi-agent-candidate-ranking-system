<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work360 - Candidate Ranking</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .header p { font-size: 1.1rem; opacity: 0.9; }
        .status-badge {
            display: inline-block;
            background: #dc3545;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            margin-top: 10px;
        }
        .status-badge.connected {
            background: #28a745;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        @media (max-width: 768px) {
            .main-grid { grid-template-columns: 1fr; }
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        .templates {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .template-btn {
            background: #f0f0f0;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        .template-btn:hover {
            background: #667eea;
            color: white;
        }
        .jd-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
            margin-bottom: 15px;
        }
        .find-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }
        .find-btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        .find-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .results { margin-top: 20px; }
        .stats {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }
        .requirements-badge {
            background: #e8f4f8;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .candidate-card {
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
            background: white;
        }
        .candidate-card:hover {
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .candidate-name {
            font-size: 18px;
            font-weight: 700;
            color: #333;
        }
        .match-score {
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
        }
        .score-high { background: #d4edda; color: #155724; }
        .score-medium { background: #fff3cd; color: #856404; }
        .score-low { background: #f8d7da; color: #721c24; }
        .candidate-details {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #666;
            flex-wrap: wrap;
        }
        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }
        .skill {
            background: #f0f0f0;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
        }
        .skill.highlight {
            background: #667eea;
            color: white;
        }
        .rationale {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            border-left: 3px solid #667eea;
        }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 10px;
        }
        .badge-yes { background: #d4edda; color: #155724; }
        .badge-no { background: #f8d7da; color: #721c24; }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
        }
        .skill-tag {
            background: #e0e7ff;
            color: #4338ca;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            display: inline-block;
            margin: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Work360 Candidate Ranking</h1>
            <p>AI-powered candidate matching system</p>
            <div id="statusBadge" class="status-badge">🔌 Checking connection...</div>
        </div>
        <div class="main-grid">
            <div class="card">
                <h2>📋 Job Description</h2>
                <div class="templates">
                    <button class="template-btn" onclick="loadTemplate('python')">🐍 Python Dev</button>
                    <button class="template-btn" onclick="loadTemplate('react')">⚛️ React Dev</button>
                    <button class="template-btn" onclick="loadTemplate('devops')">☁️ DevOps</button>
                </div>
                <textarea id="jobDescription" class="jd-input" rows="8">Senior Python Developer needed with 5+ years experience.
Required skills: FastAPI, React, PostgreSQL, Docker.
Location: Remote</textarea>
                <button id="findBtn" class="find-btn" onclick="findMatches()">🔍 Find Matching Candidates</button>
            </div>
            <div class="card">
                <h2>🏆 Candidate Rankings</h2>
                <div id="results">
                    <div style="text-align: center; padding: 40px; color: #999;">Click "Find Matches" to see ranked candidates</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const templates = {
            python: `Senior Python Developer - Remote\nRequired Skills:\n- Python\n- FastAPI\n- PostgreSQL\n- React\n- Docker\n\nLocation: Remote`,
            react: `Senior React Developer - Remote\nRequired Skills:\n- React.js\n- TypeScript\n- Redux\n- Node.js\n- MongoDB\n\nLocation: Remote`,
            devops: `DevOps Engineer - Remote\nRequired Skills:\n- Kubernetes\n- Docker\n- AWS\n- Terraform\n- CI/CD\n\nLocation: Remote`
        };

        function loadTemplate(type) {
            document.getElementById('jobDescription').value = templates[type];
        }

        async function checkConnection() {
            const statusDiv = document.getElementById('statusBadge');
            try {
                const response = await fetch('http://localhost:8000/health');
                if (response.ok) {
                    statusDiv.innerHTML = '✅ Backend Connected';
                    statusDiv.classList.add('connected');
                } else {
                    statusDiv.innerHTML = '❌ Backend Disconnected';
                }
            } catch (error) {
                statusDiv.innerHTML = '❌ Backend Disconnected - Make sure server is running on port 8000';
            }
        }

        async function findMatches() {
            const btn = document.getElementById('findBtn');
            const resultsDiv = document.getElementById('results');
            const jobDescription = document.getElementById('jobDescription').value;
            
            if (!jobDescription.trim()) {
                resultsDiv.innerHTML = '<div class="error">❌ Please enter a job description</div>';
                return;
            }
            
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Analyzing...';
            resultsDiv.innerHTML = '<div style="text-align: center; padding: 40px;"><span class="spinner"></span> Loading matches...</div>';
            
            try {
                const response = await fetch('http://localhost:8000/Api/mike/match', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ job_description: jobDescription })
                });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                displayResults(data);
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">❌ Error: ${error.message}<br><br>Make sure backend is running at http://localhost:8000</div>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🔍 Find Matching Candidates';
            }
        }
        
        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            if (!data.top_candidates || data.top_candidates.length === 0) {
                resultsDiv.innerHTML = '<div class="error">No candidates found</div>';
                return;
            }
            
            const requiredSkills = data.job_requirements.skills.map(s => s.toLowerCase());
            let html = `
                <div class="stats">
                    <span>📊 ${data.total_candidates_considered} candidates analyzed</span>
                    <span>⚡ ${data.query_time_ms} ms</span>
                </div>
                <div class="requirements-badge">
                    <strong>📋 Requirements</strong><br>
                    Role: ${data.job_requirements.role}<br>
                    Experience: ${data.job_requirements.experience_band} (${data.job_requirements.years_experience_min}+ years)<br>
                    Location: ${data.job_requirements.location}<br>
                    Skills: ${data.job_requirements.skills.map(s => `<span class="skill-tag">${s}</span>`).join('')}
                </div>
            `;
            
            data.top_candidates.slice(0, 6).forEach((match, index) => {
                const c = match.candidate;
                let scoreClass = match.match_score >= 70 ? 'score-high' : (match.match_score >= 50 ? 'score-medium' : 'score-low');
                
                html += `
                    <div class="candidate-card">
                        <div class="card-header">
                            <div class="candidate-name">
                                #${index + 1} - ${c.name}
                                <span class="badge ${match.experience_match ? 'badge-yes' : 'badge-no'}">${match.experience_match ? '✓ Exp' : '! Exp'}</span>
                                <span class="badge ${match.location_match ? 'badge-yes' : 'badge-no'}">${match.location_match ? '✓ Loc' : '! Loc'}</span>
                            </div>
                            <div class="match-score ${scoreClass}">${match.match_score}%</div>
                        </div>
                        <div class="candidate-details">
                            <span>💼 ${c.current_role || 'N/A'}</span>
                            <span>⭐ ${c.experience_years} years</span>
                            <span>📍 ${c.location}</span>
                        </div>
                        <div class="skills">
                            ${c.skills.map(skill => `<span class="skill ${requiredSkills.includes(skill.toLowerCase()) ? 'highlight' : ''}">${skill}</span>`).join('')}
                        </div>
                        <div class="rationale">🔍 ${match.match_rationale}</div>
                    </div>
                `;
            });
            resultsDiv.innerHTML = html;
        }
        
        checkConnection();
        setInterval(checkConnection, 5000);
    </script>
</body>
</html>
